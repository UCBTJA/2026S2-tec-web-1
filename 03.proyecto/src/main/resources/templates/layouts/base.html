<!DOCTYPE html>
<!--/*
  Layout base de la aplicación.
  Uso desde una vista:
    <html th:replace="~{layouts/base :: layout(~{::title}, ~{::main})}">
  La vista define su propio <title> y su <main>; todo lo demás (head, menú, scripts) vive aquí.
*/-->
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div th:replace="~{fragments/menu :: menu}"></div>

    <main class="container py-4" th:replace="${content}">
        <p>Contenido de la vista</p>
    </main>
</body>

</html>
