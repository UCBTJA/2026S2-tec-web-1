<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: layout(~{::title}, ~{::main})}">

<head>
    <title>Modificar Producto</title>
</head>

<body>
    <main class="container py-4">
        <h1>Modificar Producto</h1>

        <form th:action="@{/productos/update}" method="post">
            <input type="hidden" name="id" th:value="${producto.id}">

            <div class="mb-3">
                <label class="form-label">ID</label>
                <input type="text" class="form-control" th:value="${producto.id}" disabled>
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" maxlength="100" required
                    th:value="${producto.nombre}">
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/productos}">Cancelar</a>
        </form>
    </main>
</body>

</html>
