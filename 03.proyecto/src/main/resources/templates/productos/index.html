<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: layout(~{::title}, ~{::main})}">

<head>
    <title>Lista de Productos</title>
</head>

<body>
    <main class="container py-4">
        <h1>Productos</h1>

        <table class="table table-striped table-bordered">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
            <tr th:each="p : ${productos}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.nombre}">Ejemplo</td>
                <td><a class="btn btn-sm btn-primary" th:href="@{/productos/update(id=${p.id})}">Modificar</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="3">No hay productos</td>
            </tr>
        </table>
    </main>
</body>

</html>
